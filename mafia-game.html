<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafia Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .instructions {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .instructions h2 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .instructions p {
            color: #333;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .player-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .player-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .player-box.revealed {
            cursor: default;
        }

        .player-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }

        .role-hidden {
            font-size: 4em;
            color: #ccc;
        }

        .role-revealed {
            font-size: 2em;
            font-weight: bold;
            animation: revealAnimation 0.5s ease;
        }

        .role-citizen {
            color: #10b981;
        }

        .role-spectator {
            color: #3b82f6;
        }

        .role-mafia {
            color: #ef4444;
        }

        .role-description {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }

        @keyframes revealAnimation {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(-10deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .controls {
            text-align: center;
        }

        .reset-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .reset-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .reset-btn:active {
            transform: scale(0.98);
        }

        .stats {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .stats p {
            color: #333;
            font-size: 1.1em;
            margin: 5px 0;
        }

        .stats span {
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Mafia Game 🎭</h1>
        
        <div class="instructions">
            <h2>How to Play:</h2>
            <p>📦 Click on each box to reveal the player's role</p>
            <p>👥 <strong>5 Citizens:</strong> Normal townspeople trying to find the mafia</p>
            <p>👁️ <strong>1 Spectator:</strong> Observer who watches the game</p>
            <p>🔪 <strong>1 Mafia:</strong> The hidden villain among you!</p>
            <p>🔄 Click "Reset Game" to shuffle roles and play again</p>
        </div>

        <div class="stats" id="stats">
            <p>Revealed: <span id="revealed-count">0</span> / 7</p>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="controls">
            <button class="reset-btn" onclick="resetGame()">🔄 Reset Game</button>
        </div>
    </div>

    <script>
        const roles = [
            { name: 'Citizen', emoji: '👤', class: 'role-citizen', description: 'Normal Citizen' },
            { name: 'Citizen', emoji: '👤', class: 'role-citizen', description: 'Normal Citizen' },
            { name: 'Citizen', emoji: '👤', class: 'role-citizen', description: 'Normal Citizen' },
            { name: 'Citizen', emoji: '👤', class: 'role-citizen', description: 'Normal Citizen' },
            { name: 'Citizen', emoji: '👤', class: 'role-citizen', description: 'Normal Citizen' },
            { name: 'Spectator', emoji: '👁️', class: 'role-spectator', description: 'Observer' },
            { name: 'Mafia', emoji: '🔪', class: 'role-mafia', description: 'The Villain!' }
        ];

        let gameState = [];
        let revealedCount = 0;

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function initGame() {
            gameState = shuffleArray(roles).map((role, index) => ({
                ...role,
                id: index + 1,
                revealed: false
            }));
            revealedCount = 0;
            updateStats();
            renderBoard();
        }

        function renderBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';

            gameState.forEach((player, index) => {
                const box = document.createElement('div');
                box.className = 'player-box' + (player.revealed ? ' revealed' : '');
                box.onclick = () => revealRole(index);

                const playerNumber = document.createElement('div');
                playerNumber.className = 'player-number';
                playerNumber.textContent = `Player ${player.id}`;

                const roleContent = document.createElement('div');
                
                if (player.revealed) {
                    roleContent.className = `role-revealed ${player.class}`;
                    roleContent.innerHTML = `${player.emoji}<br>${player.name}`;
                    
                    const description = document.createElement('div');
                    description.className = 'role-description';
                    description.textContent = player.description;
                    box.appendChild(playerNumber);
                    box.appendChild(roleContent);
                    box.appendChild(description);
                } else {
                    roleContent.className = 'role-hidden';
                    roleContent.textContent = '❓';
                    box.appendChild(playerNumber);
                    box.appendChild(roleContent);
                }

                board.appendChild(box);
            });
        }

        function revealRole(index) {
            if (gameState[index].revealed) return;
            
            gameState[index].revealed = true;
            revealedCount++;
            updateStats();
            renderBoard();
        }

        function updateStats() {
            document.getElementById('revealed-count').textContent = revealedCount;
        }

        function resetGame() {
            initGame();
        }

        // Initialize game on load
        initGame();
    </script>
</body>
</html>
