<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Space-Themed English Presentation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.18.1/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.18.1/dist/theme/black.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.18.1/plugin/highlight/monokai.css">
    <style>
        /* Custom space-themed CSS will be added here */
        body {
            background: linear-gradient(to bottom, #000011, #000033);
            color: #ffffff;
        }
        .reveal .slides {
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="1" fill="white"/><circle cx="20" cy="30" r="0.5" fill="white"/><circle cx="80" cy="70" r="0.5" fill="white"/><circle cx="10" cy="80" r="0.3" fill="white"/><circle cx="90" cy="20" r="0.3" fill="white"/></svg>') repeat;
            background-size: 100px 100px;
        }
        .reveal h1, .reveal h2, .reveal h3 {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px #00ffff;
        }
        .reveal p {
            font-size: 1.2em;
        }
        .vocab-word {
            font-size: 2em;
            color: #ffaa00;
            text-shadow: 0 0 20px #ffaa00;
        }
        .button {
            background: #333;
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
            border-radius: 5px;
        }
        .button:hover {
            background: #00ffff;
            color: #000;
        }
        .spy-box {
            width: 100px;
            height: 100px;
            background: #222;
            border: 1px solid #ff0000;
            display: inline-block;
            margin: 5px;
            text-align: center;
            vertical-align: top;
        }
        .timer {
            font-size: 2em;
            color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="reveal">
        <div class="slides">
            <!-- Slides will be added here -->
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.18.1/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.18.1/plugin/highlight/highlight.js"></script>
    <script>
        Reveal.initialize({
            hash: true,
            plugins: [RevealHighlight]
        });
    </script>
    <script>
        // JavaScript for interactivity will be added here
    </script>
</body>
</html>
